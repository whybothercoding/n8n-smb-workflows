name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Structural + convention lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate every workflow.json against CLAUDE.md's conventions
        run: bash validate.sh

  docs-check:
    name: Generated docs are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Fail if README tables / flow diagrams are stale
        run: python3 scripts/generate_docs.py --check

  n8n-import-check:
    name: Real n8n-engine import check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start n8n (SQLite, no auth, for a throwaway CI import check)
        run: |
          docker run -d --name n8n -p 5678:5678 \
            -e N8N_BASIC_AUTH_ACTIVE=false \
            -e N8N_USER_MANAGEMENT_DISABLED=true \
            -e N8N_DIAGNOSTICS_ENABLED=false \
            n8nio/n8n:latest

      - name: Wait for n8n to finish booting (DB migrations included)
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5678/healthz > /dev/null 2>&1; then
              echo "n8n is up"
              exit 0
            fi
            sleep 2
          done
          echo "n8n did not become ready in time"
          docker logs n8n
          exit 1

      - name: Import every workflow.json — proves it's real, importable n8n JSON
        run: |
          status=0
          for f in workflows/*/*/workflow.json; do
            echo "== $f =="
            docker cp "$f" n8n:/tmp/import.json
            if ! docker exec n8n n8n import:workflow --input=/tmp/import.json; then
              echo "FAILED to import: $f"
              status=1
            fi
          done
          exit $status

      - name: Show n8n logs on failure
        if: failure()
        run: docker logs n8n

      - name: Stop n8n
        if: always()
        run: docker rm -f n8n || true

  secret-scan:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
      - name: Scan full git history for secrets
        run: ./gitleaks detect --source . -v --redact
